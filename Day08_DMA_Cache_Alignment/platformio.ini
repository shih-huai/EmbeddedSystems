; Day 08：DMA、快取、對齊
; Wokwi 預設的 ESP32 DevKit V1（原版 ESP32）
; espressif32 6.x 內含 Arduino-ESP32 2.0.x；Arduino 3.x 的部分 API（例如計時器）不同
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = *

; 主機端單元測試：pio test -e native（需要電腦上有 gcc）
[env:native]
platform = native
